spring:
  application:
    name: iam-service
  datasource:
    url: ${IAM_DB_DSN}
    username: ${IAM_DB_USERNAME}
    password: ${IAM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
