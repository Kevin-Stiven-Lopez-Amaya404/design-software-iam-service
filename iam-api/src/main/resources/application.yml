spring:
  application:
    name: iam-service
  datasource:
    url: ${IAM_DB_DSN}
    username: ${IAM_DB_USERNAME}
    password: ${IAM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

# Signing material for the RS256 access tokens. No defaults: a missing secret must stop
# the service at startup, never fall back to something guessable.
iam:
  jwt:
    private-key: ${IAM_JWT_PRIVATE_KEY}
    issuer: ${IAM_JWT_ISSUER}
    key-id: ${IAM_JWT_KEY_ID:iam-rsa-1}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
